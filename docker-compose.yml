services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica_dev_password
      POSTGRES_DB: clinica_nutricao
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica_nutricao"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clinica_minio
      MINIO_ROOT_PASSWORD: clinica_minio_password
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://clinica:clinica_dev_password@postgres:5432/clinica_nutricao?schema=public
      NODE_ENV: development
      PORT: 3001
      JWT_ACCESS_SECRET: dev_access_secret_troque_em_producao
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev_refresh_secret_troque_em_producao
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3020
      COOKIE_SECURE: "false"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9020
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: clinica_minio
      STORAGE_SECRET_ACCESS_KEY: clinica_minio_password
      STORAGE_BUCKET: clinica-nutricao-uploads
    ports:
      - "3021:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3021
    ports:
      - "3020:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  minio_data:
  backend_node_modules:
  frontend_node_modules:
